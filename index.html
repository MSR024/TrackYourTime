<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Track Your TIME">
<meta name="theme-color" content="#f3f5f4">
<title>Track Your TIME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one-column phone app. Date bar on top, scrolling view, fixed tab bar at the bottom. Day = 24 hour rows x 4 quarter-hour cells. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#17201d; --muted:#5f6b67; --line:#dde3e0;
  --accent:#0f6b5c; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --good:#1f8a4c; --warn:#b7791f; --bad:#c2410c; --sleep:#5b6bb5;
  --font-body:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,40,34,.06),0 4px 16px rgba(20,40,34,.06);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) body.home{background:var(--bg)}
  :root:not([data-theme="light"]) .logo b,:root:not([data-theme="light"]) .addnew,:root:not([data-theme="light"]) .missed button{filter:brightness(1.45) saturate(1.1)}
  :root:not([data-theme="light"]){
    --bg:#0f1513; --surface:#18201d; --ink:#e6ece9; --muted:#9aa8a3; --line:#2a3531;
    --accent:#3fb39b; --accent-ink:#06201a; --accent-soft:#18352e;
    --good:#4cc283; --warn:#e0a84a; --bad:#f07a4a; --sleep:#8d9bea;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"] body.home{background:var(--bg)}
:root[data-theme="dark"] .logo b,:root[data-theme="dark"] .addnew,:root[data-theme="dark"] .missed button{filter:brightness(1.45) saturate(1.1)}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --ink:#e6ece9; --muted:#9aa8a3; --line:#2a3531;
  --accent:#3fb39b; --accent-ink:#06201a; --accent-soft:#18352e;
  --good:#4cc283; --warn:#e0a84a; --bad:#f07a4a; --sleep:#8d9bea;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
header.top{padding:calc(var(--sat) + 10px) 16px 10px;display:flex;align-items:center;gap:8px;background:var(--bg);border-bottom:1px solid var(--line)}
.datebtn{flex:1;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:2px}
.datebtn b{font-size:17px;font-weight:600}
.datebtn small{color:var(--muted);font-size:12px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.todaybtn{height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sab);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:640px}
nav.tabs button{flex:1;background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.notice{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.notice.warn{background:color-mix(in srgb,var(--warn) 18%,transparent)}

/* Now card */
.now .when{font-size:13px;color:var(--muted)}
.now .slot{font-size:22px;font-weight:600}
.now .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.now .actions .wide{grid-column:1/-1}

/* Day grid */
.grid{display:flex;flex-direction:column;gap:4px}
.hr{display:grid;grid-template-columns:44px repeat(4,1fr);gap:4px;align-items:stretch}
.hr .lab{font-family:var(--font-mono);font-size:11px;color:var(--muted);padding-top:6px;text-align:right;padding-right:4px}
.blockhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 2px;padding:6px 2px 4px;border-bottom:2px solid var(--line);font-size:14px}
.blockhd:first-child{margin-top:0}
.blockhd .mono{font-size:12px}
.cell{position:relative;min-height:46px;border-radius:8px;border:1px dashed var(--line);background:transparent;padding:4px 5px 4px 7px;text-align:left;font-size:11.5px;line-height:1.2;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
.cell .t{font-family:var(--font-mono);font-size:9.5px;color:var(--muted)}
.cell .a{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell.filled{border:1px solid transparent;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.cell.filled::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.cell.cont .a{visibility:hidden}
.cell.gap{background:color-mix(in srgb,var(--warn) 9%,transparent);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.cell.now{box-shadow:0 0 0 2px var(--accent)}
.cell.future{opacity:.55}
.cell.sel{box-shadow:0 0 0 2px var(--ink);background:color-mix(in srgb,var(--ink) 10%,var(--surface))}
.cell.sel::after{content:"✓";position:absolute;right:4px;top:2px;font-size:11px;font-weight:700}

/* Selection bar */
.selbar{position:fixed;left:0;right:0;bottom:calc(58px + var(--sab));display:flex;justify-content:center;padding:0 12px;z-index:6;pointer-events:none}
.selbar .in{pointer-events:auto;width:100%;max-width:616px;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.selbar .count{flex:1;font-size:13px;padding-left:4px}
.selbar button{border:0;border-radius:9px;padding:9px 11px;font-weight:600;font-size:13px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg)}
.selbar button.go{background:var(--accent);color:var(--accent-ink)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:86%;border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-bottom:var(--sab)}
.sheet .hd{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .hd .ttl{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet .bd{overflow-y:auto;padding:12px 16px 20px}
.search{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.catgroup{margin-top:14px}
.catgroup .cname{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.newact{border:1px dashed var(--accent);border-radius:12px;padding:12px;margin-top:4px;display:flex;flex-direction:column;gap:8px}
select,.txt{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;width:100%}

/* Summary */
.score{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.ring text{font-family:var(--font-mono);fill:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:10px;padding:8px 10px;background:var(--bg)}
.tile .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .v{font-family:var(--font-mono);font-size:17px;font-weight:600}
.strip{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--bg)}
.strip{position:relative;overflow:visible}
.strip i{flex:1;display:block}
.strip i:first-child{border-radius:6px 0 0 6px}.strip i:last-child{border-radius:0 6px 6px 0}
.nowmark{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--ink);border-radius:2px}
.nowmark::after{content:"";position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.axis span{width:0;display:flex;justify-content:center;white-space:nowrap}
.axis span:first-child{justify-content:flex-start}.axis span:last-child{justify-content:flex-end}
.axis{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--muted);margin-top:4px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .top{display:flex;justify-content:space-between;font-size:13.5px;gap:8px}
.bar .top span:first-child{display:flex;align-items:center;gap:7px;font-weight:500}
.bar .track{height:8px;border-radius:4px;background:var(--bg);margin-top:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--c)}
.pill{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ind-wrap{margin-top:14px}
.inds{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ind{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;padding:8px 2px;border-radius:12px;background:var(--bg);min-width:0}
.ind svg{margin-bottom:2px}
.ind .trk{fill:none;stroke:var(--line);stroke-width:5}
.ind .val{fill:none;stroke-width:5;stroke-linecap:round;stroke:var(--muted)}
.ind.good .val{stroke:var(--good)}.ind.mid .val{stroke:var(--warn)}.ind.low .val{stroke:var(--bad)}
.ind text{font-family:var(--font-mono);font-size:13px;font-weight:600;fill:var(--ink)}
.ind b{font-size:11.5px;line-height:1.15;overflow-wrap:anywhere}
.ind .rg{font-size:9.5px;color:var(--muted)}
.ind .lv{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:2px}
.ind.good .lv{color:var(--good)}.ind.mid .lv{color:var(--warn)}.ind.low .lv{color:var(--bad)}
.indnote{font-size:11.5px;margin-top:8px}
.prodcard{display:flex;flex-direction:column;gap:10px}
.prow .trow{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.prow .tn{display:flex;align-items:center;gap:7px;min-width:0}
.prow .pc{font-size:12px}
.prow .track{height:7px;border-radius:4px;background:var(--bg);margin-top:4px;overflow:hidden}
.prow .fill{height:100%;border-radius:0 4px 4px 0;background:var(--c)}
.pnote{font-size:11.5px}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles3 .v{font-size:18px}
.tree{display:flex;flex-direction:column;gap:14px}
.tc .trow{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.tc .trow.cat{font-size:15px;font-weight:600}
.tc .tn{display:flex;align-items:center;gap:7px;min-width:0}
.tc .tv small{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}
.tc .track{height:8px;border-radius:4px;background:var(--bg);margin:4px 0 6px;overflow:hidden}
.tc .track.thin{height:5px;opacity:.75}
.tc .fill{height:100%;border-radius:0 4px 4px 0;background:var(--c)}
.expbtn{width:24px;height:24px;flex:none;border-radius:7px;border:1px solid var(--line);background:var(--bg);font-size:16px;line-height:1;font-weight:600;color:var(--ink);display:grid;place-items:center;padding:0}
.trow.cat{cursor:pointer;user-select:none}
.tacts{margin-top:6px;padding-left:16px;border-left:2px solid color-mix(in srgb,var(--c) 35%,transparent);margin-left:4px}
.blk{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:0}
.seg{display:flex;height:12px;gap:2px}
.seg i{display:block;border-radius:3px;min-width:3px}
.seg i.empty{background:var(--bg);border:1px dashed var(--line)}
.chart{display:grid;grid-template-columns:34px 1fr;height:190px;position:relative;margin-top:22px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:right;padding-right:6px;margin:-6px 0}
.plot{position:relative;border-bottom:1px solid var(--line)}
.gl{position:absolute;left:0;right:0;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:0 4px}
.bcol{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer;outline:none}
.bcol .stack{width:68%;max-width:34px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.bcol .stack i{display:block;width:100%;min-height:2px}
.bcol .stack i:first-child{border-radius:4px 4px 0 0}
.bcol .btot{white-space:nowrap;font-size:10px;color:var(--muted);position:absolute;top:-14px}
.bcol.on .stack,.bcol:focus-visible .stack{filter:brightness(1.08);outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.xax{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-left:38px;padding:0 4px;margin-top:4px}
.xax button{background:none;border:0;padding:4px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.1}
.xax button small{font-size:11px}
.xax button.cur{color:var(--accent);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.card{position:relative}
.tip{position:absolute;z-index:4;background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:10px;padding:8px 10px;font-size:12.5px;min-width:170px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.tip[hidden]{display:none}
.tip b{display:block}
.tip>span.mono{position:absolute;right:10px;top:8px;font-weight:600}
.tip div{display:flex;align-items:center;gap:6px}
.tip div .mono{margin-left:auto;padding-left:10px}
.tablewrap{overflow-x:auto}
.wt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.wt th{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
.wt th.cn,.wt td.cn{text-align:left}
.wt td{padding:7px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
.wt .r{text-align:right;white-space:nowrap;padding-left:6px}
.wt td.cn{white-space:nowrap;min-width:92px;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.wt td.cn .dot{display:inline-block;vertical-align:middle;margin-right:5px}
.wt tr.catrow{cursor:pointer}
.wt tr.catrow td.cn{font-weight:600}
.wt tr.sub td{font-size:12.5px;border-bottom-style:dashed}
.wt tr.sub td.cn{padding-left:26px;color:var(--muted)}
.wt .caret{display:inline-block;width:12px;color:var(--muted);font-size:11px}
.cell7{width:14px;height:28px;text-align:center}
.wt td.cell7{position:relative;padding:4px 2px}
.mini{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:7px;border-radius:2px 2px 0 0;background:var(--c);max-height:calc(100% - 10px)}
.wt .chg{font-size:11px}
.wt td.r{font-size:12px}
.up{color:var(--accent)}.down{color:var(--muted)}
.wkrows{display:flex;flex-direction:column;gap:6px}
.wkrow{display:grid;grid-template-columns:44px 1fr 42px;gap:8px;align-items:center;background:none;border:0;padding:6px 0;text-align:left;border-radius:8px}
.wkrow.cur .wd b{color:var(--accent)}
.wkrow .wd{display:flex;flex-direction:column;line-height:1.1;font-size:13px}
.wkrow .wd span{color:var(--muted);font-size:12px}
.wkrow .wk{display:flex;flex-direction:column;gap:3px;min-width:0}
.wkrow .strip{height:16px}
.wkrow .wp{text-align:right;font-weight:600;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;padding-top:6px}
.week .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;background:none;border:0;padding:0}
.week .b{width:70%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}
.week .col.cur .b{background:var(--ink)}
.week .pct{font-family:var(--font-mono);font-size:10.5px;color:var(--muted)}
.week .d{font-size:11px;color:var(--muted)}

/* Settings */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .name{flex:1;font-weight:500;min-width:0;overflow-wrap:anywhere}
.li{flex-wrap:wrap}
.li select{width:auto;max-width:48%;padding:7px 8px;font-size:14px}
.li input[type=color]{width:32px;height:32px;border:0;padding:0;background:none;border-radius:8px}
.grp{display:block;margin-top:4px;width:100%;max-width:200px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted)}
.gname{font-size:13px;font-weight:700;margin:16px 0 0;padding-bottom:4px;border-bottom:1px solid var(--line)}
.mg{border-left:4px solid var(--c);padding:10px 12px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mghd{display:flex;align-items:center;gap:8px}
.mghd input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;flex:none}
.nm{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px;font-size:15px}
.nm:hover{border-color:var(--line)}
.nm:focus{border-color:var(--accent);background:var(--bg);outline:none}
.nm.cat{font-weight:700;font-size:16px}
.mghd select,.mgact select{width:auto;padding:6px 6px;font-size:13px;border-radius:8px;flex:none;max-width:34%}
.mgact select{font-size:12px;color:var(--muted)}
.mgacts{display:flex;flex-direction:column;gap:2px;padding-left:8px;border-left:1px dashed var(--line);margin-left:14px}
.mgact{display:flex;align-items:center;gap:6px}
.mgact .mv{max-width:26%}
.mgadd{display:flex;gap:6px;margin-top:4px}
.mgadd .nm{border-color:var(--line);background:var(--bg)}
.mgadd .btn{padding:6px 12px;font-size:13px}
.confirm{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:13.5px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}

<script>

/* ---------- Defaults from your Excel worksheet (Week1) ---------- */

    {name:"Exercise",color:"#1baf7a"},
    {name:"Food",color:"#eda100"},
    {name:"Office Travel",color:"#6250d6"},

    {name:"Home Chores",color:"#e87ba4"}

    {name:"Breakfast",cat:"Food",type:"essential"},{name:"Lunch",cat:"Food",type:"essential"},{name:"Dinner",cat:"Food",type:"essential"},{name:"Tea",cat:"Food",type:"essential"},{name:"Drinks",cat:"Food",type:"essential"},

    {name:"Time Tracker",cat:"Organizing",type:"productive"},{name:"Task Planning",cat:"Organizing",type:"productive"},
    {name:"Dishwasher Unload",cat:"Home Chores",type:"productive"},{name:"Clothes Washing",cat:"Home Chores",type:"productive"},{name:"Vacuuming",cat:"Home Chores",type:"productive"},
    {name:"Cleaning",cat:"Home Chores",type:"productive"},{name:"Garage",cat:"Home Chores",type:"productive"},{name:"Backyard",cat:"Home Chores",type:"productive"}

const REMOVED_CATS=["Wakeup","Food Eating","Self Organizing","Home Organizing","Rest","Self Care","USA Groceries","USA Phone Calls","USA Travel","Time Waste"];
const REMOVED_ACTS=["Wakeup","Brushing","Shaving","Rest Room","Bags Unpack","Apple Upgrade","Costco Order","Thara Call","Tickets Search","Time Waste"];
/* Bring settings saved by an older version up to the current category list, keeping anything you added yourself. */
function migrate(st){
  if(st&&st.v===SETTINGS_V&&(st.categories||[]).length)return {settings:st,changed:false};
  // v3 -> v4: keep every rename and deletion, only move untouched default colors to the validated palette
  if(st&&(st.v===3||st.v===4)&&(st.categories||[]).length){const out=JSON.parse(JSON.stringify(st));
    if(out.v===3)out.categories.forEach(c=>{if(OLD_COLORS[c.name]&&c.color===OLD_COLORS[c.name])c.color=NEW_COLORS[c.name]});
    // v5: how time counts lives on each activity only; an activity without its own setting takes its category's old one
    out.activities.forEach(a=>{if(!a.type){const c=out.categories.find(x=>x.name===a.cat);a.type=(c&&c.type)||"essential"}});
    out.categories.forEach(c=>{delete c.type});out.v=SETTINGS_V;return {settings:out,changed:true}}
  const out=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  if(st){
    (st.categories||[]).forEach(c=>{if(!REMOVED_CATS.includes(c.name)&&!out.categories.some(x=>x.name===c.name))out.categories.push(c)});
    (st.activities||[]).forEach(a=>{if(REMOVED_ACTS.includes(a.name)||out.activities.some(x=>x.name.toLowerCase()===a.name.toLowerCase()))return;
      out.activities.push({...a,cat:REMOVED_CATS.includes(a.cat)?"Organizing":a.cat})});
  }
  return {settings:out,changed:true};
}
/* ---------- Usual sleep: empty windows inside it count as Sleep once their time has passed ---------- */
const SLEEP_DEFAULT={on:true,from:92,to:16}; // 11:00 PM to 4:00 AM
function sleepCfg(){return (S.settings&&S.settings.sleep)||SLEEP_DEFAULT}
function inSleep(i){const c=sleepCfg();if(!c.on)return false;return c.from>c.to?(i>=c.from||i<c.to):(i>=c.from&&i<c.to)}
function sleepEntry(){const a=S.settings.activities.find(x=>x.type==="sleep");return a?{c:a.cat,a:a.name,auto:true}:{c:"Sleep",a:"Sleep",auto:true}}
function slotsOf(k){const real=day(k).slots;if(!sleepCfg().on)return real;const tk=todayKey();if(k>tk)return real;
  const ns=nowSlot(),out=Object.assign({},real);let e=null;
  for(let i=0;i<96;i++){if(!out[i]&&inSleep(i)&&(k<tk||i<=ns)){e=e||sleepEntry();out[i]=e}}return out}
function hatch(c){return `repeating-linear-gradient(135deg,${c} 0 3px,color-mix(in srgb,${c} 45%,transparent) 3px 6px)`}
function sleepLabel(){const c=sleepCfg();return `${fmt(c.from)} – ${fmt(c.to)}`}

/* Wakeup was dropped as an activity: clear any entries still saved with it. Returns the dates that changed. */
function purgeDropped(){const changed=[];Object.entries(S.days).forEach(([k,d])=>{let ch=false;Object.keys(d.slots).forEach(i=>{const v=d.slots[i];if(v.c==="Wakeup"||v.a==="Wakeup"){delete d.slots[i];ch=true}});if(ch)changed.push(k)});return changed}
function remapDays(){const changed=[];Object.entries(S.days).forEach(([k,d])=>{let ch=false;Object.values(d.slots).forEach(v=>{if(REMOVED_CATS.includes(v.c)||(v.c==="FTB Work"&&v.a==="Lunch")){const n=actCat(v.a);if(n&&n!==v.c){v.c=n;ch=true}}});if(ch)changed.push(k)});return changed}
// Wed 25 Mar 2026 from the worksheet, 12:00 AM – 8:00 AM in 15-minute rows
const SEED_DAY={date:"2026-03-25",list:["Sleep","Sleep","Sleep","Sleep","Sleep","Sleep","Rest Room","Bags Unpack","Bags Unpack","Bags Unpack","Time Tracker","Task Planning","Task Planning","Time Waste","Costco Order","Thara Call","Shaving","Brushing","Time Waste","Time Waste","Apple Upgrade","Tickets Search","Time Waste","Walking","Walking","Time Waste","Tea","Tea","Walking","Walking","Walking","Time Tracker"]};

/* ---------- State ---------- */
/* A day runs midnight to midnight. Slot 0 = 12:00 AM, slot 95 = 11:45 PM. */
const DAY_START_Q=0;
const OLD_START_Q=20; // earlier versions started the day at 5:00 AM
const BLOCKS=[
  {name:"Sleep",from:0,to:20},
  {name:"Early Morning",from:20,to:32},
  {name:"Work Day",from:32,to:64},
  {name:"Evening",from:64,to:76},
  {name:"Night",from:76,to:88},
  {name:"Sleep",from:88,to:96}
];
/* Move days saved with the old 5 AM start onto midnight-based slots. Returns the dates that changed. */
function convertOld(target,k,slots){const touched=[k];Object.entries(slots).forEach(([i,v])=>{const q=+i+OLD_START_Q;let kk=k,ii=q;if(q>=96){kk=addDays(k,1);ii=q-96;if(!touched.includes(kk))touched.push(kk)}(target[kk]||(target[kk]={slots:{}})).slots[ii]=v});return touched}
function nowPct(){const d=new Date();return (d.getHours()*60+d.getMinutes())/1440*100}
function nowMark(k){return k===todayKey()?`<b class="nowmark" style="left:${nowPct()}%" title="Now"></b>`:""}
function blockOf(i){return BLOCKS.find(b=>i>=b.from&&i<b.to)}
const S={settings:null,days:{},date:todayKey(),tab:"home",sel:new Set(),form:{from:null,to:null,cat:"",act:""},recent:[],storage:"device",note:"",ready:false};
function pad(n){return String(n).padStart(2,"0")}
function keyOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayKey(){return keyOf(new Date(Date.now()-DAY_START_Q*15*60000))}
function parseKey(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(k,n){const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)}
function nowSlot(){const d=new Date();return (d.getHours()*4+Math.floor(d.getMinutes()/15)-DAY_START_Q+96)%96}
function clockQ(i){return (i+DAY_START_Q)%96}
function fmt(i,short){const m=clockQ(i)*15,h=Math.floor(m/60)%24,mm=m%60,ap=h<12?"AM":"PM",h12=h%12||12;return short?(h12+(mm?":"+pad(mm):"")+(ap==="AM"?"a":"p")):(h12+":"+pad(mm)+" "+ap)}
function range(i){return fmt(i)+" – "+fmt(i+1)}
function hrs(slots){const m=slots*15;const h=Math.floor(m/60),r=m%60;return h?(h+"h"+(r?" "+r+"m":"")):(r+"m")}
function toTrack(dateKey,min){const q=Math.floor(min/15);if(q<DAY_START_Q)return {k:addDays(dateKey,-1),i:q+96-DAY_START_Q};return {k:dateKey,i:q-DAY_START_Q}}
function calKey(k,i){return clockQ(i)<DAY_START_Q||i>=96-DAY_START_Q?addDays(k,1):k}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function day(k){return S.days[k]||{slots:{}}}
function cat(name){return S.settings.categories.find(c=>c.name===name)}
function isDark(){const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function catColor(name){const c=(cat(name)?.color||"#8a8f98").toLowerCase();return isDark()&&DARK_STEP[c]?DARK_STEP[c]:c}
function catIsSleep(name){return S.settings.activities.some(a=>a.cat===name&&a.type==="sleep")}

function typeOf(v){const x=S.settings.activities.find(y=>y.name===v.a&&y.cat===v.c)||S.settings.activities.find(y=>y.name===v.a);return (x&&x.type)||"essential"}

/* ---------- Storage: your private claude.ai storage, with this device as backup ---------- */
const LS="trackyourtime.v1";
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let db=null,coll=null,inflight={},queued={};
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"null")}catch(e){return null}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({settings:S.settings,days:S.days,base:0}))}catch(e){}}
function seedState(){
  S.settings=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  S.days={};

}
function persist(docId,data){
  lsSave();
  if(!coll)return;
  queued[docId]=data;
  if(inflight[docId])return;
  const run=async()=>{
    while(queued[docId]!==undefined){
      const body=queued[docId];delete queued[docId];inflight[docId]=true;
      try{ if(body===null) await coll.doc(docId).delete(); else await coll.doc(docId).set(body); }
      catch(e){ if(e&&e.code==="quota_exceeded")toast("Storage is full. Delete old days to keep saving online.");
        else if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));if(queued[docId]===undefined)queued[docId]=body;}
        else {S.storage="device";S.note="Online saving stopped. Your entries are kept on this device.";render();} }
      inflight[docId]=false;
    }
  };
  run();
}
function saveDay(k){const d=S.days[k];const n=d?Object.keys(d.slots).length:0;persist("d-"+k,n?{kind:"day",date:k,b:0,slots:d.slots}:null)}

async function initStorage(){
  const local=lsLoad();
  if(local&&local.settings){S.settings=migrate(local.settings).settings;
    if(local.base===0)S.days=local.days||{};else{S.days={};Object.entries(local.days||{}).forEach(([k,d])=>convertOld(S.days,k,d.slots||{}))}
    remapDays();purgeDropped();lsSave()}else seedState();
  S.ready=true;render();scrollToNow();
  if(!window.claude||!window.claude.use)return;
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const uid=u?await u.id():null;
    if(!d||!uid)return;
    db=d;coll=db.collection("data/users/"+uid);
    let first=true;
    const timer=setTimeout(()=>{S.note="Can't reach your online data yet. New entries are saved on this device.";render()},10000);
    coll.onSnapshot(snap=>{
      if(snap.metadata.fromCache&&first)return;
      clearTimeout(timer);
      const docs=snap.docs.map(x=>({id:x.id,data:x.data()}));
      if(first){
        first=false;S.storage="online";S.note="";
        if(!docs.length){ // first visit online: upload what this device has
          saveSettings();Object.keys(S.days).forEach(saveDay);render();return;
        }

function recentActs(){

function themeFor(k){
  const d=parseKey(k),y=d.getFullYear(),m=d.getMonth(),md=k.slice(5);
  const near=(key,before,after)=>{if(!key)return false;const lo=addDays(key,-before),hi=addDays(key,after);return k>=lo&&k<=hi};
  if(md>="12-31"||md<="01-02")return "newyear";
  if(md>="12-20"&&md<="12-26")return "christmas";
  if(near(DIWALI[y],2,2))return "diwali";
  if(near(nthWeekday(y,10,4,4),3,1))return "thanksgiving";
  if(md>="10-25"&&md<="10-31")return "halloween";
  if(md>="07-02"&&md<="07-04")return "july4";
  if(near(HOLI[y],1,1))return "holi";
  if(md>="03-15"&&md<="03-17")return "stpatrick";
  if(md>="02-12"&&md<="02-14")return "valentine";
  return m<=1||m===11?"winter":m<=4?"spring":m<=7?"summer":"autumn";
}
function applyTheme(){
  const t=THEMES[themeFor(todayKey())];const r=document.documentElement.style;
  t.letters.forEach((c,i)=>r.setProperty("--l"+(i+1),c));
  r.setProperty("--theme-accent",t.accent);r.setProperty("--theme-glow",t.glow);
  return t;
}

   <button data-act="cancel" aria-label="Cancel selection">✕</button>
   <button class="go" data-act="pick">Set activity</button></div></div>`;
}

/* Summary */
function stats(k){
  const s=slotsOf(k);const by={},acts={},types={productive:0,essential:0,sleep:0,waste:0};let logged=0;
  Object.values(s).forEach(v=>{logged++;by[v.c]=(by[v.c]||0)+1;const key=v.a+"\u0001"+v.c;acts[key]=(acts[key]||0)+1;types[typeOf(v)]++});
  const awake=logged-types.sleep;
  const score=awake?Math.round(types.productive/awake*100):null;
  return {s,by,acts,types,logged,awake,score};
}
function ring(p){
  const r=48,c=2*Math.PI*r,v=p==null?0:p/100;
  const col=p==null?"var(--line)":p>=60?"var(--good)":p>=40?"var(--warn)":"var(--bad)";
  return `<svg class="ring" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Productive ${p??0} percent"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 60 60)"/><text x="60" y="62" text-anchor="middle" font-size="26" font-weight="600">${p==null?"–":p+"%"}</text><text x="60" y="80" text-anchor="middle" font-size="10" fill="var(--muted)" style="fill:var(--muted)">productive</text></svg>`;
}
function renderSummary(){

    <div style="font-weight:600;font-size:16px">${st.score==null?"No awake time logged yet":verdict(st.score)}</div>
    <div class="muted" style="font-size:13px;margin-top:2px">Productive time as a share of your logged awake time (${hrs(st.awake)}).</div></div></div>
    <div class="tiles" style="margin-top:12px">
      ${["productive","essential","waste","sleep"].map(t=>`<div class="tile"><div class="k"><span class="dot" style="--c:${TYPES[t].color}"></span>${TYPES[t].label}</div><div class="v">${hrs(st.types[t])}</div></div>`).join("")}
    </div>
    <div class="muted" style="font-size:12.5px;margin-top:10px">${hrs(st.logged)} logged${unlogged?` · <span style="color:var(--warn)">${hrs(unlogged)} not logged${isToday?" so far":""}</span>`:""}</div></div>`;
  // strip
  let strip="";for(let i=0;i<96;i++){const v=st.s[i];strip+=`<i style="background:${v?catColor(v.c):"transparent"}" title="${range(i)}${v?" · "+esc(v.a):""}"></i>`}
  h+=`<h2>Timeline</h2><div class="card"><div class="strip">${strip}${nowMark(k)}</div><div class="axis"><span>12a</span><span>3a</span><span>6a</span><span>9a</span><span>12p</span><span>3p</span><span>6p</span><span>9p</span><span>12a</span></div></div>`;
  // blocks
  h+=`<h2>By block</h2><div class="card"><div class="list">${BLOCKS.map(b=>{let lg=0,pr=0,aw=0,ws=0;const top={};for(let i=b.from;i<b.to;i++){const v=st.s[i];if(v){lg++;const ty=typeOf(v);if(ty!=="sleep")aw++;if(ty==="productive")pr++;if(ty==="waste")ws++;top[v.c]=(top[v.c]||0)+1}}
    const t=Object.entries(top).sort((x,y)=>y[1]-x[1])[0];
    return `<div class="li" style="align-items:flex-start"><div class="name"><b>${b.name}</b> <span class="muted mono" style="font-size:12px">${fmt(b.from,true)}–${fmt(b.to,true)}</span><div class="muted" style="font-size:12.5px;font-weight:400">${lg?`${hrs(lg)} of ${hrs(b.to-b.from)} logged${t?` · mostly ${esc(t[0])}`:""}${ws?` · ${hrs(ws)} wasted`:""}`:"Nothing logged"}</div></div><span class="mono" style="font-weight:600">${aw?Math.round(pr/aw*100)+"%":"–"}</span></div>`}).join("")}</div></div>`;

  const acts=Object.entries(st.acts).sort((a,b)=>b[1]-a[1]);
  if(acts.length)h+=`<h2>By activity</h2><div class="card"><div class="list">${acts.map(([key,n])=>{const [a,c]=key.split("\u0001");return `<div class="li"><span class="dot" style="--c:${catColor(c)}"></span><span class="name">${esc(a)} <span class="muted" style="font-weight:400;font-size:12.5px">· ${esc(c)}</span></span><span class="mono">${hrs(n)}</span></div>`}).join("")}</div></div>`;

  main.innerHTML=h;
}
/* ---------- Review: time spent by category and activity ---------- */
function agg(k){const s=slotsOf(k);const by={};let total=0;
  Object.values(s).forEach(v=>{total++;const c=by[v.c]||(by[v.c]={n:0,acts:{}});c.n++;c.acts[v.a]=(c.acts[v.a]||0)+1});return {total,by,s}}
function catOrder(names){const order=S.settings.categories.map(c=>c.name);return [...names].sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?999:ia)-(ib<0?999:ib)})}
function pct(n,d){return d?Math.round(n/d*100):0}
function stripHTML(s,k){let h="";for(let i=0;i<96;i++){const v=s[i];h+=`<i style="background:${v?(v.auto?hatch(catColor(v.c)):catColor(v.c)):"transparent"}" title="${range(i)}${v?" · "+esc(v.c)+" › "+esc(v.a):""}"></i>`}return `<div class="strip">${h}${nowMark(k)}</div><div class="axis"><span>12a</span><span>3a</span><span>6a</span><span>9a</span><span>12p</span><span>3p</span><span>6p</span><span>9p</span><span>12a</span></div>`}
/* Productivity indicator per time block (interim rule: share of logged awake time in Productive categories).
   The two Sleep blocks (12–5 AM and 10 PM–12 AM) are shown together as one Sleep indicator. */
function mergedBlocks(){const out=[];BLOCKS.forEach(b=>{let m=out.find(x=>x.name===b.name);if(!m){m={name:b.name,ranges:[]};out.push(m)}m.ranges.push([b.from,b.to])});
  const sl=out.find(x=>x.name==="Sleep");return sl?[sl,...out.filter(x=>x!==sl)]:out}
function blockIndicators(s,k,note){return blockIndicatorsMulti([[s,k]],note)}
function blockIndicatorsMulti(list,note){
  const tk=todayKey(),ns=nowSlot();
  return `<div class="inds">${mergedBlocks().map(b=>{
    let total=0,elapsed=0,logged=0,prod=0,waste=0,ess=0,slept=0,started=false;
    list.forEach(([s,k])=>b.ranges.forEach(([f,t])=>{for(let i=f;i<t;i++){total++;if(k<tk||(k===tk&&i<=ns)){started=true;elapsed++}else continue;const v=s[i];if(!v)continue;logged++;const ty=typeOf(v);if(ty==="productive")prod++;else if(ty==="waste")waste++;else if(ty==="sleep")slept++;else ess++}}));
    const isSleep=b.name==="Sleep";const awake=logged-slept;
    const pct=isSleep?(elapsed?Math.round(slept/elapsed*100):null):(awake?Math.round(prod/awake*100):null);
    const lvl=pct==null?"none":isSleep?(pct>=85?"good":pct>=60?"mid":"low"):(pct>=70?"good":pct>=40?"mid":"low");
    const word={good:isSleep?"Rested":"Strong",mid:"Mixed",low:isSleep?"Short":"Low",none:started?"Not logged":"Later"}[lvl];
    const r=19,c=2*Math.PI*r,fr=pct==null?0:pct/100;
    const range=b.ranges.length>1?`${fmt(b.ranges[1][0],true)}–${fmt(b.ranges[0][1],true)}`:`${fmt(b.ranges[0][0],true)}–${fmt(b.ranges[0][1],true)}`;
    const detail=isSleep?`${hrs(slept)} slept`:awake?`${hrs(prod)} productive${waste?` · ${hrs(waste)} wasted`:""}`:started?"Nothing logged":list.length>1?"Not started":"Later today";
    return `<div class="ind ${lvl}" title="${esc(b.name)} ${range}: ${esc(detail)}"><svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><circle cx="24" cy="24" r="${r}" class="trk"/>${fr>0?`<circle cx="24" cy="24" r="${r}" class="val" stroke-dasharray="${c*fr} ${c}" transform="rotate(-90 24 24)"/>`:""}<text x="24" y="28" text-anchor="middle">${pct==null?"–":pct}</text></svg>
      <b>${esc(b.name)}</b><span class="rg mono">${range}</span><span class="lv">${word}</span></div>`}).join("")}</div>
    <div class="muted indnote">${note?note+" ":""}Score = productive share of the awake time you logged in each block, based on each activity's setting in Lists. Sleep shows how much of 10 PM–5 AM you slept, counting only the part of the night that has passed.</div>`;
}

/* Week view: Monday to Sunday containing the selected date */
function weekStart(k){const d=parseKey(k);const dow=(d.getDay()+6)%7;return addDays(k,-dow)}

    <div class="chart" id="wchart"><div class="yax">${ticks.slice().reverse().map(t=>`<span>${t}h</span>`).join("")}</div>
      <div class="plot">${ticks.map(t=>`<div class="gl" style="bottom:${t/top*100}%"></div>`).join("")}
        <div class="bars">${A.map((a,di)=>{const segs=catOrder(Object.keys(a.by)).map(c=>`<i style="height:${a.by[c].n/4/top*100}%;background:${catColor(c)}"></i>`).reverse().join("");
          return `<div class="bcol ${days[di]===tk?"cur":""}" data-wday="${di}" tabindex="0" aria-label="${parseKey(days[di]).toLocaleDateString(undefined,{weekday:"long"})} ${hrs(a.total)}"><span class="btot mono">${a.total?(Math.round(a.total/4*10)/10)+"h":""}</span><div class="stack">${segs}</div></div>`}).join("")}</div></div></div>

      <div class="muted" style="font-size:12px;margin:8px 4px 0">Tap a category to see its activities. Small bars show each day's hours.${cutoff<7?` "Change" compares with the same days (${parseKey(days[0]).toLocaleDateString(undefined,{weekday:"short"})}–${parseKey(days[cutoff-1]).toLocaleDateString(undefined,{weekday:"short"})}) of last week.`:""}</div></div>`;

function verdict(p){return p>=70?"Very productive day":p>=50?"Solid day":p>=30?"Room to improve":"Mostly unproductive"}

/* Settings */
function nameTaken(list,name,skip){return list.some((x,i)=>i!==skip&&x.name.toLowerCase()===name.toLowerCase())}
function updateEntries(fn){Object.keys(S.days).forEach(k=>{let ch=false;Object.values(S.days[k].slots).forEach(v=>{if(fn(v))ch=true});if(ch)saveDay(k)})}
function renameCat(ix,name){const st=S.settings,c=st.categories[ix];name=name.trim();
  if(!name||name===c.name){render();return}
  if(nameTaken(st.categories,name,ix)){toast(`There's already a category called ${name}.`);render();return}
  const old=c.name;c.name=name;st.activities.forEach(a=>{if(a.cat===old)a.cat=name});
  updateEntries(v=>{if(v.c===old){v.c=name;return true}});if(S.form.cat===old)S.form.cat=name;
  saveSettings();render();toast(`Renamed to ${name}`)}
function renameAct(ai,name){const st=S.settings,a=st.activities[ai];name=name.trim();
  if(!name||name===a.name){render();return}
  if(st.activities.some((x,i)=>i!==ai&&x.cat===a.cat&&x.name.toLowerCase()===name.toLowerCase())){toast(`${a.cat} already has ${name}.`);render();return}
  const old=a.name;a.name=name;updateEntries(v=>{if(v.c===a.cat&&v.a===old){v.a=name;return true}});if(S.form.act===old)S.form.act=name;
  saveSettings();render();toast(`Renamed to ${name}`)}
function orphans(){const out={};Object.entries(S.days).forEach(([k,d])=>Object.values(d.slots).forEach(v=>{

function sampleWeek(){
  const st=S.settings,tk=todayKey(),ns=nowSlot();const has=n=>st.activities.find(a=>a.name===n);
  const pick=(...names)=>{for(const n of names){const a=has(n);if(a)return a}return null};
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const touched=[];
  for(let j=6;j>=0;j--){const k=addDays(tk,-j);const dow=parseKey(k).getDay();const weekend=dow===0||dow===6;
    const d=S.days[k]||(S.days[k]={slots:{}});let ch=false;
    const put=(f,t,act)=>{if(!act)return;for(let i=f;i<t&&i<96;i++){if(k===tk&&i>ns)break;if(d.slots[i])continue;d.slots[i]={a:act.name,c:act.cat};ch=true}};
    const w=rnd(0,2); // a little variety each day
    put(16,18,pick("Freshup"));
    put(18,22-w,pick(["Walking","Running","Swimming"][rnd(0,2)],"Walking"));
    put(22-w,24,pick("Tea"));
    if(weekend){
      put(24,30,pick("Kids Activities"));put(30,32,pick("Breakfast"));put(32,40,pick(["Cleaning","Garage","Backyard","Vacuuming"][rnd(0,3)]));
      put(40,44,pick("Swimming","Walking"));put(44,48,pick("Lunch"));put(48,56,pick("Time with Wife"));put(56,58,pick("Timewaster"));
      put(58,64,pick("Kids Activities"));put(64,66,pick("Clothes Washing"));
    }else{
      put(24,26,pick("Kids Activities"));put(26,28,pick("Breakfast"));put(28,28+w,pick("Timewaster"));put(28+w,32,pick("To Office"));
      put(32,38,pick("Project Calls"));put(38,40,pick("Follow up Meetings"));put(40,44,pick("Deliverables"));put(44,48,pick("Lunch"));
      put(48,54,pick("Deliverables"));put(54,56,pick("Learnings"));put(56,58,pick("Catchup"));put(58,60+w,pick("Timewaster"));put(60+w,64,pick("From Office"));
    }

    put(80,84,pick("Task Planning"));put(84,88,pick("Calls with Family"));put(88,92,pick("Time Tracker"));

async function exportXlsx(keys,name){

function toMinutes(v){
  if(v==null||v==="")return null;
  if(v instanceof Date)return v.getHours()*60+v.getMinutes();
  if(typeof v==="number")return Math.round((v%1)*1440);
  const m=String(v).trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap]\.?m\.?)?$/i);if(!m)return null;
  let h=+m[1];const mm=+m[2];if(m[3]){const pm=/p/i.test(m[3]);if(h===12)h=0;if(pm)h+=12}return h*60+mm;
}
function toDateKey(v){
  if(v instanceof Date)return keyOf(v);
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*86400000));return keyOf(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  const d=new Date(v);return isNaN(d)?null:keyOf(d);
}
async function importFile(file){
  if(!window.XLSX){toast("The Excel library didn't load. Check your connection and reload.");return}
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    let count=0;const touched=new Set();const st=S.settings;
    wb.SheetNames.forEach(sn=>{
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true});
      const hdr=(rows[0]||[]).map(x=>String(x||"").trim().toLowerCase());
      const ci=n=>hdr.indexOf(n);const iD=ci("date"),iS=ci("start time"),iE=ci("end time"),iA=ci("activity"),iC=ci("category");
      if(iD<0||iS<0||iA<0)return;
      rows.slice(1).forEach(r=>{
        const a=String(r[iA]||"").trim();if(!a)return;
        const k=toDateKey(r[iD]);const sm=toMinutes(r[iS]);if(!k||sm==null)return;
        let em=iE>=0?toMinutes(r[iE]):null;if(em==null||em<=sm)em=em===0?1440:sm+15;
        const c=(iC>=0&&String(r[iC]||"").trim())||actCat(a)||"Uncategorized";
        if(!cat(c))st.categories.push({name:c,type:/waste/i.test(c)?"waste":/rest|sleep/i.test(c)?"sleep":"productive",color:PALETTE[st.categories.length%PALETTE.length]});
        if(!actCat(a))st.activities.push({name:a,cat:c});
        for(let q=Math.floor(sm/15);q<Math.ceil(em/15)&&q<96;q++){const t=toTrack(k,q*15);const d=S.days[t.k]||(S.days[t.k]={slots:{}});d.slots[t.i]={a,c};count++;touched.add(t.k)}
      });
    });
    if(!count){toast("No rows found. The sheet needs Date, Start Time and Activity columns.");return}
    saveSettings();touched.forEach(saveDay);render();
    toast(`Imported ${hrs(count)} across ${touched.size} day${touched.size>1?"s":""}`);
  }catch(e){toast("That file couldn't be read. Try saving it as .xlsx or .csv.")}
}

    case "hidenight":S.nightDismissed=todayKey();render();break;
    case "newcat":S.form.newCat=true;S.form.newAct=false;render();document.getElementById("f-newcat")?.focus();break;
    case "cancelnewcat":S.form.newCat=false;S.form.newCatName="";render();break;
    case "newact":S.form.newAct=true;render();document.getElementById("f-newact")?.focus();break;
    case "cancelnewact":S.form.newAct=false;S.form.newActName="";render();break;
    case "lognow":S.sel=new Set([ns]);render();openSheet();break;
    case "fillgap":{const last=lastLogged(S.date);S.sel=new Set();for(let i=last+1;i<=ns;i++)if(!s[i])S.sel.add(i);render();openSheet();break}
    case "same":{const p=s[ns-1];S.sel=new Set([ns]);assign(p.a,p.c);break}
    case "between":{const arr=[...S.sel].sort((a,b)=>a-b);for(let i=arr[0];i<=arr[arr.length-1];i++)S.sel.add(i);render();break}
    case "erase":clearSel();break;
    case "cancel":S.sel.clear();render();break;
    case "pick":openSheet();break;
    case "close":closeSheet();break;
    case "exportday":exportXlsx([S.date],`TimeTracker_${S.date}.xlsx`);break;
    case "exportall":exportXlsx(Object.keys(S.days).filter(k=>Object.keys(S.days[k].slots).length),`TimeTracker_all_${todayKey()}.xlsx`);break;
  }
});
document.addEventListener("dblclick",e=>{const r=e.target.closest("[data-daycat]");if(!r||e.target.closest("[data-dayexp]"))return;
  S.dayOpen=S.dayOpen||new Set();const c=r.dataset.daycat;S.dayOpen.has(c)?S.dayOpen.delete(c):S.dayOpen.add(c);render()});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="sleep-on"||t.id==="sleep-from"||t.id==="sleep-to"){const c=Object.assign({},sleepCfg());
    if(t.id==="sleep-on")c.on=t.checked;else c[t.id==="sleep-from"?"from":"to"]=+t.value;
    if(c.from===c.to){toast("Start and end can't be the same time.");render();return}
    S.settings.sleep=c;saveSettings();render();toast(c.on?`Usual sleep: ${sleepLabel()}`:"Usual sleep is off");return}
  if(t.dataset&&t.dataset.orphto!==undefined&&t.value){const o=orphans()[+t.dataset.orphto];const [c,a]=t.value.split("\u0001");if(o){fixOrphan(o.c,o.a,{c,a});render();toast(`Moved ${hrs(o.n)} to ${c} › ${a}`)}return}
  if(t.id==="f-from"){S.form.from=+t.value;S.form.to=S.form.from+1;prefillFromSlot();render();return}
  if(t.id==="f-cat"){S.form.cat=t.value;S.form.act="";S.form.newAct=false;render();return}
  if(t.id==="f-act"){S.form.act=t.value;return}
  if(t.dataset.cattype!==undefined){S.settings.categories[+t.dataset.cattype].type=t.value;saveSettings()}
  else if(t.dataset.catcolor!==undefined){S.settings.categories[+t.dataset.catcolor].color=t.value;saveSettings();render()}
  else if(t.dataset.catgroup!==undefined){S.settings.categories[+t.dataset.catgroup].group=t.value.trim();saveSettings();render()}
  else if(t.dataset.renamecat!==undefined){renameCat(+t.dataset.renamecat,t.value)}
  else if(t.dataset.renameact!==undefined){renameAct(+t.dataset.renameact,t.value)}
  else if(t.dataset.acttype!==undefined){S.settings.activities[+t.dataset.acttype].type=t.value;saveSettings()}
  else if(t.dataset.actcat!==undefined){S.settings.activities[+t.dataset.actcat].cat=t.value;saveSettings();render()}
  else if(t.id==="imp"&&t.files[0]){importFile(t.files[0]);t.value=""}
});
document.addEventListener("input",e=>{if(e.target.id==="f-newcat")S.form.newCatName=e.target.value;else if(e.target.id==="f-newact")S.form.newActName=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("nm")&&!e.target.closest("form")){e.preventDefault();e.target.blur()}});
document.addEventListener("submit",e=>{
  if(e.target.dataset&&e.target.dataset.addact!==undefined){e.preventDefault();const c=S.settings.categories[+e.target.dataset.addact];const inp=e.target.querySelector("input");const n=inp.value.trim();if(!n)return;
    if(S.settings.activities.some(a=>a.cat===c.name&&a.name.toLowerCase()===n.toLowerCase())){toast(`${c.name} already has ${n}.`);return}
    S.settings.activities.push({name:n,cat:c.name,type:"essential"});saveSettings();render();toast(`Added ${n} to ${c.name}. It counts as Essential; change it with the dropdown next to it.`);
    const again=document.querySelector(`[data-addact="${e.target.dataset.addact}"] input`);if(again)again.focus();return}
  if(e.target.id==="logform"){e.preventDefault();homeLog();return}
  if(e.target.id==="addcat"){e.preventDefault();const v=document.getElementById("newcat").value.trim();if(!v||cat(v))return;
    S.settings.categories.push({name:v,color:PALETTE[S.settings.categories.length%PALETTE.length]});saveSettings();render()}
});
// keep "now" fresh while the app is open
let lastNow=nowSlot();
setInterval(()=>{const n=nowSlot();if(n!==lastNow){lastNow=n;if(S.tab!=="settings"&&S.tab!=="home"&&!overlay.innerHTML)render()}
  const m=document.querySelector(".today .nowmark");if(m)m.style.left=nowPct()+"%";},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.tab==="edit"&&!overlay.innerHTML&&!S.sel.size){render();scrollToNow()}});
initStorage();
</script>
</body>
</html>
